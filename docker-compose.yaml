version: "3.8"
services:
  account_db:
    image: postgres:16
    environment:
      POSTGRES_DB: accounts
      POSTGRES_USER: copa
      POSTGRES_PASSWORD: "1"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copa"]
      interval: 3s
      timeout: 3s
      retries: 5
    volumes:
      - account_db_data:/var/lib/postgresql/data

  order_db:
    image: postgres:16
    environment:
      POSTGRES_DB: promo
      POSTGRES_USER: copa
      POSTGRES_PASSWORD: "1"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copa"]
      interval: 3s
      timeout: 3s
      retries: 5
    volumes:
      - order_db_data:/var/lib/postgresql/data

  account_service:
    build: ./account_service
    command: uv run python manage.py migrate && uv run python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./account_service:/app
      - account_venv:/app/.venv
    ports:
      - "8000:8000"
    env_file:
      - ./account_service/.env
    depends_on:
      account_db:
        condition: service_healthy

  order_service:
    build: ./discount_service
    command: uv run uvicorn src.main:app --host 0.0.0.0 --port 8010 --reload
    volumes:
      - ./discount_service:/app
    ports:
      - "8010:8010"
    env_file:
      - ./discount_service/.env
      - discount_venv:/app/.venv
    depends_on:
      order_db:
        condition: service_healthy

volumes:
  account_db_data:
  discount_db_data:
  account_venv:
  order_venv:
